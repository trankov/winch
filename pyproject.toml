[project]
name = "winch"
version = "0.0.1"
description = "REST and RPC connection toolkit"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Trankov" }]
keywords = ["networking", "rest", "rpc", "toolkit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/trankov/winch"
Repository = "https://github.com/trankov/winch"

[dependency-groups]
dev = [
  "deptry",
  "ipykernel>=7.1.0",
  "ipywidgets",
  "ruff",
  "typing-extensions>=4.16.0",
  "wemake-python-styleguide>=1.7.1",
]
test = ["hypothesis", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winch"]

[tool.uv]
default-groups = "all"
