[flake8]
# WPS is a flake8 plugin. Ruff covers the rest; keep flake8 on WPS only.
# https://wemake-python-styleguide.readthedocs.io/en/latest/pages/usage/setup.html
select = WPS, E999
ignore = WPS114
format = wemake
show-source = true
statistics = false
doctests = true

extend-exclude =
    .venv
    dist
    build

per-file-ignores =
    # pytest fixture names shadow the thing they fixture:
    src/tests/*.py: WPS442
    # Schema-классы и операции на каждый сериализатор:
    src/tests/test_serializers.py: WPS202
    # Публичный re-export — вход пакета, не логика модуля:
    src/winch/__init__.py: WPS410, WPS412
    # Протоколы библиотек рядом с тремя транспортами:
    src/winch/transports.py: WPS202
